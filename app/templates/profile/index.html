{% extends "base.html" %}
{% block title %}User Profile & Settings{% endblock %}
{% block page_title %}User Profile & Account Settings{% endblock %}

{% block content %}
<div class="dashboard-grid">
  <!-- Profile Info Card -->
  <div class="col-6">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title"><i class="fa-solid fa-user" style="color: var(--accent-primary);"></i> Profile Information</h3>
      </div>
      <form action="{{ url_for('profile.index') }}" method="POST">
        <input type="hidden" name="action" value="update_info">
        
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" value="{{ user.username if user else session.username }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" value="{{ user.email if user else session.email }}" required>
        </div>

        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-floppy-disk"></i> Update Profile Details
        </button>
      </form>
    </div>
  </div>

  <!-- Password Change Card -->
  <div class="col-6">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title"><i class="fa-solid fa-key" style="color: var(--accent-secondary);"></i> Update Password</h3>
      </div>
      <form action="{{ url_for('profile.index') }}" method="POST">
        <input type="hidden" name="action" value="update_password">

        <div class="form-group">
          <label class="form-label" for="current_password">Current Password</label>
          <input type="password" id="current_password" name="current_password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="new_password">New Password</label>
          <input type="password" id="new_password" name="new_password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm New Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-secondary">
          <i class="fa-solid fa-lock"></i> Change Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
