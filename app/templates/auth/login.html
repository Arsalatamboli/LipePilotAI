{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block auth_content %}
<div class="auth-card">
  <div class="auth-header">
    <div class="brand-icon" style="margin: 0 auto; width: 48px; height: 48px; font-size: 1.5rem;">
      <i class="fa-solid fa-compass"></i>
    </div>
    <h2 class="auth-title">Welcome to LifePilot AI</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem;">Sign in to your personal daily-life assistant</p>
  </div>

  <form action="{{ url_for('auth.login') }}" method="POST">
    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="user@lifepilot.ai" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
      <i class="fa-solid fa-right-to-bracket"></i> Sign In
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
    <p style="font-size: 0.9rem; color: var(--text-secondary);">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--accent-secondary); font-weight: 600; text-decoration: none;">Register Now</a>
    </p>
  </div>
</div>
{% endblock %}
