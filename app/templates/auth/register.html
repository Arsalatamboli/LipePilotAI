{% extends "base.html" %}
{% block title %}Create Account{% endblock %}

{% block auth_content %}
<div class="auth-card">
  <div class="auth-header">
    <div class="brand-icon" style="margin: 0 auto; width: 48px; height: 48px; font-size: 1.5rem;">
      <i class="fa-solid fa-compass"></i>
    </div>
    <h2 class="auth-title">Create Account</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem;">Join LifePilot AI to optimize your productivity & lifestyle</p>
  </div>

  <form action="{{ url_for('auth.register') }}" method="POST">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="john_doe" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
      <i class="fa-solid fa-user-plus"></i> Create Account
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
    <p style="font-size: 0.9rem; color: var(--text-secondary);">
      Already registered? <a href="{{ url_for('auth.login') }}" style="color: var(--accent-secondary); font-weight: 600; text-decoration: none;">Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
