{% extends "base.html" %}
{% block title %}Daily Life Tracker{% endblock %}
{% block page_title %}Daily Life Tracker{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title"><i class="fa-solid fa-pen-to-square" style="color: var(--accent-primary);"></i> Log Daily Metrics & Lifestyle Data</h3>
      <a href="{{ url_for('tracker.history') }}" class="btn btn-outline" style="font-size: 0.85rem;">
        <i class="fa-solid fa-history"></i> History Logs
      </a>
    </div>

    <form action="{{ url_for('tracker.daily_form') }}" method="POST">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="record_date">Date</label>
          <input type="date" id="record_date" name="record_date" class="form-control" value="{{ existing_record.record_date if existing_record else today_str }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="mood">Current Mood</label>
          <select id="mood" name="mood" class="form-select">
            <option value="Happy" {% if existing_record and existing_record.mood == 'Happy' %}selected{% endif %}>😊 Happy & Energized</option>
            <option value="Focused" {% if existing_record and existing_record.mood == 'Focused' %}selected{% endif %}>🎯 Focused & Productive</option>
            <option value="Neutral" {% if not existing_record or existing_record.mood == 'Neutral' %}selected{% endif %}>😐 Neutral</option>
            <option value="Tired" {% if existing_record and existing_record.mood == 'Tired' %}selected{% endif %}>😴 Tired & Low Energy</option>
            <option value="Stressed" {% if existing_record and existing_record.mood == 'Stressed' %}selected{% endif %}>😣 Stressed & Overwhelmed</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="sleep_hours">Sleep Hours</label>
          <input type="number" step="0.25" min="0" max="24" id="sleep_hours" name="sleep_hours" class="form-control" value="{{ existing_record.sleep_hours if existing_record else 7.5 }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="work_hours">Work / Study Hours</label>
          <input type="number" step="0.25" min="0" max="24" id="work_hours" name="work_hours" class="form-control" value="{{ existing_record.work_hours if existing_record else 8.0 }}" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="screen_time">Non-Work Screen Time (hrs)</label>
          <input type="number" step="0.25" min="0" max="24" id="screen_time" name="screen_time" class="form-control" value="{{ existing_record.screen_time if existing_record else 3.5 }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="exercise_mins">Physical Exercise (mins)</label>
          <input type="number" step="5" min="0" max="300" id="exercise_mins" name="exercise_mins" class="form-control" value="{{ existing_record.exercise_mins if existing_record else 30 }}" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="stress_level">Self-Reported Stress Level (1 to 10)</label>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <input type="range" min="1" max="10" id="stress_level" name="stress_level" class="form-control" value="{{ existing_record.stress_level if existing_record else 4 }}" oninput="document.getElementById('stress_val').innerText = this.value">
          <span id="stress_val" style="font-weight: 700; font-size: 1.2rem; color: var(--accent-secondary); min-width: 30px;">
            {{ existing_record.stress_level if existing_record else 4 }}
          </span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Notes / Reflections</label>
        <textarea id="notes" name="notes" class="form-control" placeholder="What went well today? What challenges occurred?">{{ existing_record.notes if existing_record else '' }}</textarea>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 1rem;">
        <i class="fa-solid fa-floppy-disk"></i> Save & Run AI Prediction Engine
      </button>
    </form>
  </div>
</div>
{% endblock %}
